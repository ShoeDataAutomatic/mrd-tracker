name: Daily scrape

on:
  schedule:
    # 7:30am Sydney time (AEDT, UTC+11). Adjust if needed:
    # AEDT (Oct–Apr): subtract 11hrs → 20:30 UTC
    # AEST (Apr–Oct): subtract 10hrs → 21:30 UTC
    - cron: '30 20 * * *'
  workflow_dispatch:    # Allows you to trigger a manual run from GitHub at any time

permissions:
  contents: write       # Required to commit the updated database back to the repo

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 45   # Increased — New Look OOS now runs fully on residential IP (~7 min extra)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install curl_cffi (optional — TLS fingerprint bypass for New Look OOS)
        run: pip install "curl_cffi>=0.7.0"
        continue-on-error: true

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Initialise database (safe on first run)
        run: python run.py --init

      - name: Run scrape
        run: python run.py --scrape

      - name: Refresh image URLs
        run: python run.py --refresh-images

      - name: Run scoring
        run: python run.py --score

      - name: Send email digest (Mondays only)
        if: ${{ github.event_name == 'schedule' && steps.day.outputs.day == 'Monday' }}
        run: python run.py --email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}

      - name: Sync to Google Sheets
        run: python run.py --sheets
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        continue-on-error: true   # Don't fail the whole run if Sheets isn't configured

      - name: Checkpoint database (flush WAL before commit)
        run: python -c "import sqlite3; conn = sqlite3.connect('mrd_tracker.db'); conn.execute('PRAGMA wal_checkpoint(TRUNCATE);'); conn.close()"

      - name: Commit updated database to repo
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git remote set-url origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/ShoeDataAutomatic/mrd-tracker.git"
          git add mrd_tracker.db
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $d = Get-Date -Format 'yyyy-MM-dd'
            git commit -m "data: daily scrape $d"
            git push
          } else {
            Write-Output "No database changes to commit."
          }
